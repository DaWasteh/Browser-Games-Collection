<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Pong</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: manipulation;
        }
        html, body {
            max-width: 100%;
            overflow-x: hidden;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(135deg, #0a0a1a, #12122d);
            font-family: 'Courier New', monospace;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
            overflow-y: auto;
            padding: 12px 12px 54px;
            gap: 8px;
        }

        h1 {
            font-size: clamp(1.25rem, 3vmin, 2rem);
            text-shadow: 0 0 15px #0ff, 0 0 25px #0ff;
            letter-spacing: 6px;
            text-align: center;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.75; }
            50% { opacity: 1; }
            100% { opacity: 0.75; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #top-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            width: min(92vw, 800px);
            min-height: 36px;
        }
        #top-actions.hidden {
            visibility: hidden;
            pointer-events: none;
        }
        .hud-btn {
            background: rgba(0, 255, 255, 0.08);
            border: 1.5px solid rgba(0, 255, 255, 0.45);
            color: #0ff;
            padding: 6px 12px;
            min-height: 36px;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .hud-btn:hover {
            background: rgba(0, 255, 255, 0.2);
            border-color: #0ff;
            color: #fff;
        }
        .hud-btn:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }

        #game-container {
            position: relative;
            border: 3px solid #0ff;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
            width: min(92vw, 800px);
            aspect-ratio: 16 / 10;
            max-height: min(62dvh, 500px);
            margin: 0 auto;
            overflow: hidden;
            background: #0a0a1a;
        }
        canvas {
            display: block;
            background: #0a0a1a;
            width: 100%;
            height: 100%;
            touch-action: none;
        }

        /* Vollbild-Modal statt im kleinen Canvas-Container gefangen zu sein! */
        #ui-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(8, 10, 24, 0.86);
            backdrop-filter: blur(6px);
            z-index: 100;
            padding: 16px;
            overflow-y: auto;
        }
        #ui-overlay.hidden {
            display: none !important;
        }
        .menu-card {
            width: min(92vw, 440px);
            max-height: 92dvh;
            overflow-y: auto;
            background: linear-gradient(160deg, rgba(16, 22, 48, 0.96), rgba(8, 10, 26, 0.96));
            border: 2px solid #0ff;
            border-radius: 12px;
            box-shadow: 0 0 32px rgba(0, 255, 255, 0.25);
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        #ui-overlay h2 {
            font-size: clamp(1.6rem, 5vw, 2.3rem);
            margin: 0 0 10px 0;
            color: #0ff;
            text-shadow: 0 0 18px #0ff, 0 0 40px rgba(0, 255, 255, 0.5);
            letter-spacing: 8px;
            text-align: center;
        }
        #ui-overlay p {
            font-size: clamp(0.9rem, 2.4vw, 1.05rem);
            margin: 0 0 10px 0;
            color: #fff;
            text-align: center;
        }
        #ui-overlay h3 {
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            color: #0ff;
            margin: 0 0 8px 0;
            text-shadow: 0 0 10px #0ff;
            text-align: center;
        }
        #ui-overlay .winner-text {
            font-size: clamp(1.2rem, 3.5vw, 1.65rem);
            color: #0ff;
            margin: 4px 0 6px;
            text-shadow: 0 0 20px #0ff;
            animation: slideUp 0.4s ease;
        }
        #ui-overlay .score-result {
            font-size: clamp(0.95rem, 2.6vw, 1.15rem);
            color: #cfd8e3;
            margin: 0 0 14px 0;
        }
        .stats-pill {
            font-size: 0.85rem;
            color: #8be9fd;
            background: rgba(0, 255, 255, 0.08);
            border: 1px solid rgba(0, 255, 255, 0.28);
            border-radius: 999px;
            padding: 5px 12px;
            margin-bottom: 10px;
            text-align: center;
        }
        .stats-pill:empty { display: none; }

        /* Screen sections */
        .overlay-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 10px;
        }
        .overlay-screen.active {
            display: flex;
        }
        #ui-overlay button {
            background: rgba(0, 255, 255, 0.05);
            border: 1.5px solid rgba(0, 255, 255, 0.4);
            color: #0ff;
            min-height: 44px;
            padding: 10px 16px;
            font-size: 15px;
            font-family: 'Courier New', monospace;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.18s ease;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            min-width: 100px;
            text-align: center;
        }
        #ui-overlay button:hover {
            background: rgba(0, 255, 255, 0.18);
            color: #fff;
            border-color: #0ff;
            box-shadow: 0 0 14px rgba(0, 255, 255, 0.35);
            transform: translateY(-1px);
        }
        #ui-overlay button:active {
            transform: translateY(0);
        }
        #ui-overlay button:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }
        #ui-overlay button.primary-btn {
            background: rgba(0, 255, 255, 0.16);
            border-color: #0ff;
            width: 100%;
            max-width: 280px;
            font-size: 16px;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.25);
        }
        #ui-overlay button.primary-btn:hover {
            background: rgba(0, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        #ui-overlay button.secondary-btn {
            font-size: 14px;
            border-color: rgba(0, 255, 255, 0.3);
            width: 100%;
            max-width: 280px;
        }
        #mode-select, .difficulty-select {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        #mode-select button, .difficulty-select button {
            flex: 1 1 90px;
            min-width: 84px;
            padding: 10px 12px;
            font-size: 14px;
        }
        #mode-select button.active, .difficulty-select button.active {
            background: rgba(0, 255, 255, 0.22);
            color: #fff;
            border-color: #0ff;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.38);
        }
        .difficulty-select.hidden-group {
            display: none;
        }

        #name-input {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 280px;
        }
        #name-input input {
            background: rgba(0, 0, 0, 0.35);
            border: 1.5px solid rgba(0, 255, 255, 0.35);
            border-radius: 6px;
            color: #0ff;
            min-height: 44px;
            padding: 8px 10px;
            font-size: 15px;
            text-align: center;
            transition: border-color 0.2s, box-shadow 0.2s;
            font-family: 'Courier New', monospace;
        }
        #name-input input:focus {
            outline: none;
            border-color: #0ff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.35);
        }
        #name-input input::placeholder {
            color: rgba(170, 200, 210, 0.5);
        }

        /* Scoreboard overlay styles */
        #overlay-scoreboard {
            width: 100%;
            max-height: 36dvh;
            overflow-y: auto;
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 6px;
            padding: 6px;
        }
        #overlay-scoreboard .score-entry {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 7px 8px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.12);
            font-size: 13px;
            color: #d0d8e0;
        }
        #overlay-scoreboard .score-entry:last-child {
            border-bottom: none;
        }
        #overlay-scoreboard .score-entry:nth-child(even) {
            background: rgba(0, 255, 255, 0.04);
        }
        #scoreboard-empty {
            color: #888;
            text-align: center;
            padding: 12px 0;
        }

        /* Score-Display genau so breit wie #game-container (kein Auseinanderreißen bei 21:9 / 32:9!) */
        #score-display {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: min(92vw, 800px);
            font-size: clamp(1rem, 2.4vw, 1.35rem);
            gap: 12px;
        }
        #score-display span {
            font-size: clamp(1.25rem, 3.6vmin, 2rem);
            font-weight: bold;
        }
        .player-score { color: #0ff; text-shadow: 0 0 6px #0ff; }
        .ai-score { color: #ff4d6d; text-shadow: 0 0 6px #ff4d6d; }
        #controls-info {
            font-size: clamp(0.75rem, 1.8vw, 0.92rem);
            color: #a8b2c4;
            text-align: center;
            line-height: 1.5;
            max-width: min(92vw, 760px);
        }

        .game-collection-link { position: fixed; left: 12px; bottom: 12px; z-index: 10000; padding: 8px 12px; border: 1px solid #0ff; border-radius: 999px; background: rgba(0, 0, 0, .9); color: #fff; text-decoration: none; font-weight: 700; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.45); }
        .game-collection-link:hover { background: #044; }
        .game-collection-link:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }

        @media (max-height: 460px) and (orientation: landscape) {
            body { padding: 6px 10px 44px; gap: 4px; justify-content: flex-start; }
            h1 { font-size: 1rem; letter-spacing: 4px; }
            #game-container { max-height: calc(100dvh - 125px); }
            #controls-info { display: none; }
            .menu-card { padding: 12px 14px; }
            .overlay-screen { gap: 7px; }
        }
    </style>
</head>
<body>
    <a class="game-collection-link" href="../index.html" aria-label="Zur Spieleauswahl">← Spieleauswahl</a>
    <h1>P O N G</h1>

    <div id="top-actions" class="hidden" aria-label="Spielsteuerung">
        <button type="button" class="hud-btn" id="btn-pause" onclick="togglePause()">⏸ Pause</button>
        <button type="button" class="hud-btn" id="btn-menu" onclick="returnToMenu()">☰ Menü</button>
    </div>

    <div id="game-container">
        <canvas id="game-canvas"></canvas>
    </div>

    <div id="score-display">
        <div class="player-score"><span id="player1-name-display">Spieler 1</span>: <span id="player-score">0</span></div>
        <div class="ai-score" id="ai-score-container"><span id="ai-score-label">CPU</span>: <span id="ai-score">0</span></div>
    </div>
    <div id="controls-info">
        <strong>1P vs CPU:</strong> Maus/Touch (gesamtes Feld), W/S oder ↑/↓ | <strong>2 Spieler:</strong> W/S &amp; ↑/↓ oder Touch links/rechts<br>
        Wer zuerst 5 Punkte erreicht, gewinnt!
    </div>

    <!-- Vollbild-Overlay (nicht mehr im kleinen Canvas-Container eingesperrt) -->
    <div id="ui-overlay" role="dialog" aria-modal="true" aria-label="Pong-Menü">
        <div class="menu-card">
            <!-- MAIN MENU SCREEN -->
            <div id="screen-main-menu" class="overlay-screen active">
                <h2>PONG</h2>
                <div class="stats-pill" id="menu-stats"></div>
                <div id="mode-select">
                    <button type="button" id="btn-ai" class="active" onclick="selectMode('ai')">vs CPU</button>
                    <button type="button" id="btn-2p" onclick="selectMode('2p')">2 Spieler</button>
                </div>
                <div class="difficulty-select" id="difficulty-select">
                    <button type="button" onclick="setDifficulty('easy')">Leicht</button>
                    <button type="button" class="active" onclick="setDifficulty('medium')">Mittel</button>
                    <button type="button" onclick="setDifficulty('hard')">Schwer</button>
                </div>
                <div id="name-input">
                    <input type="text" id="player1-name" placeholder="Spieler 1 Name" maxlength="20">
                    <input type="text" id="player2-name" placeholder="Spieler 2 Name (optional)" maxlength="20">
                </div>
                <button type="button" class="primary-btn" onclick="startGame()">Spiel starten</button>
                <button type="button" class="secondary-btn" onclick="showScoreboardScreen()">Beste Ergebnisse</button>
            </div>

            <!-- GAME OVER SCREEN -->
            <div id="screen-game-over" class="overlay-screen">
                <h2>PONG</h2>
                <h3 class="winner-text" id="winner-text">&nbsp;</h3>
                <p class="score-result" id="score-result"></p>
                <div class="stats-pill" id="gameover-stats"></div>
                <button type="button" class="primary-btn" onclick="restartGame()">Erneut spielen</button>
                <button type="button" class="secondary-btn" onclick="showMainMenuScreen()">Zum Menü</button>
                <button type="button" class="secondary-btn" onclick="showScoreboardScreen()">Beste Ergebnisse</button>
            </div>

            <!-- SCOREBOARD SCREEN -->
            <div id="screen-scoreboard" class="overlay-screen">
                <h3>Beste Ergebnisse</h3>
                <div class="stats-pill" id="scoreboard-stats"></div>
                <div id="overlay-scoreboard">
                    <p id="scoreboard-empty">Noch keine Spiele gespielt!</p>
                </div>
                <button type="button" class="primary-btn" onclick="showMainMenuScreen()">Zurück zum Menü</button>
            </div>
        </div>
    </div>

    <script src="../shared/game-scores.js"></script>
    <script>
        // === Game Constants ===
        const PADDLE_WIDTH = 12;
        const BALL_SIZE = 12;
        const WINNING_SCORE = 5;
        const BASE_SPEED = 6;
        const MAX_SPEED = 14;
        const STATS_KEY = 'pongStats';

        // === Game State ===
        let gameMode = 'ai';
        let difficulty = 'medium';
        let gameRunning = false;
        let animationId = null;
        let player1Score = 0;
        let player2Score = 0;
        let lastHitPlayer = null;
        let serveDirection = 1;
        let gameWon = false;

        // === Player Names ===
        let player1Name = 'Spieler 1';
        let player2Name = 'Spieler 2';

        // === DOM Elements ===
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('ui-overlay');
        const topActions = document.getElementById('top-actions');
        const btnPause = document.getElementById('btn-pause');
        const aiScoreContainer = document.getElementById('ai-score-container');
        const aiScoreLabel = document.getElementById('ai-score-label');
        const difficultySelect = document.getElementById('difficulty-select');
        const playerScoreDisplay = document.getElementById('player-score');
        const aiScoreDisplay = document.getElementById('ai-score');
        const player1NameDisplay = document.getElementById('player1-name-display');
        const winnerText = document.getElementById('winner-text');
        const scoreResult = document.getElementById('score-result');
        const scoreboardEmpty = document.getElementById('scoreboard-empty');
        const overlayScoreboard = document.getElementById('overlay-scoreboard');

        // === Game Objects ===
        const player1 = {
            x: 15,
            y: 0,
            width: PADDLE_WIDTH,
            height: 90,
            color: '#0ff',
            targetY: 0,
            speed: 0,
            isTouching: false
        };

        const player2 = {
            x: 0,
            y: 0,
            width: PADDLE_WIDTH,
            height: 90,
            color: '#ff4d6d',
            targetY: 0,
            speed: 0,
            isTouching: false
        };

        const ball = {
            x: 0,
            y: 0,
            size: BALL_SIZE,
            speedX: 0,
            speedY: 0,
            baseSpeed: BASE_SPEED,
            speedMultiplier: 1
        };

        let particles = [];
        function loadScoreboardData() {
            try {
                const raw = localStorage.getItem('pongScoreboard');
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed)
                    ? parsed.filter(entry => entry && typeof entry === 'object').slice(-50)
                    : [];
            } catch (e) { return []; }
        }
        function loadPongStats() {
            const base = { wins: 0, losses: 0, gamesPlayed: 0, winStreak: 0, bestStreak: 0 };
            try {
                const raw = localStorage.getItem(STATS_KEY);
                if (!raw) return base;
                const p = JSON.parse(raw);
                if (p && typeof p === 'object') {
                    base.wins = Math.max(0, Number(p.wins) || 0);
                    base.losses = Math.max(0, Number(p.losses) || 0);
                    base.gamesPlayed = Math.max(0, Number(p.gamesPlayed) || 0);
                    base.winStreak = Math.max(0, Number(p.winStreak) || 0);
                    base.bestStreak = Math.max(0, Number(p.bestStreak) || 0);
                }
            } catch (e) {}
            return base;
        }
        function savePongStats() {
            try { localStorage.setItem(STATS_KEY, JSON.stringify(pongStats)); } catch (e) {}
        }
        function formatStatsSummary() {
            if (!pongStats.gamesPlayed) return '';
            return `Spiele: ${pongStats.gamesPlayed} · Siege: ${pongStats.wins} · Niederlagen: ${pongStats.losses} · Serie: ${pongStats.winStreak}`;
        }
        function renderStatsPills() {
            const text = formatStatsSummary();
            ['menu-stats', 'gameover-stats', 'scoreboard-stats'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = text;
            });
        }

        let scoreboardData = loadScoreboardData();
        let pongStats = loadPongStats();
        let paused = false;
        const FIXED_DT = 1000 / 60;
        let lastFrameTime = 0;
        let simAccumulator = 0;
        const keyboard = { p1Up: false, p1Down: false, p2Up: false, p2Down: false };

        // === Sounds (WebAudio, asset-free) ===
        let audioCtx = null;

        function ensureAudio() {
            if (audioCtx) {
                if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
                return audioCtx;
            }
            try {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) audioCtx = new AC();
            } catch (e) { audioCtx = null; }
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
            return audioCtx;
        }

        function initSounds() { ensureAudio(); }

        const SOUND_FREQ = { hit: 520, score: 700, win: 880 };
        function playSound(name) {
            try {
                const ac = ensureAudio();
                if (!ac) return;
                const now = ac.currentTime;
                const osc = ac.createOscillator();
                const gain = ac.createGain();
                osc.connect(gain);
                gain.connect(ac.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(SOUND_FREQ[name] || 500, now);
                gain.gain.setValueAtTime(0.0001, now);
                gain.gain.exponentialRampToValueAtTime(0.14, now + 0.01);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
                osc.onended = () => { try { osc.disconnect(); gain.disconnect(); } catch (e) {} };
                osc.start(now);
                osc.stop(now + 0.18);
            } catch (e) {}
        }

        // === Particle System ===
        function createParticles(x, y, color, count = 15) {
            for (let i = 0; i < count; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    life: 1,
                    color,
                    size: Math.random() * 2 + 1
                });
            }
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                if (p.size > 0.2) p.size *= 0.96;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function drawParticles() {
            for (let i = 0; i < particles.length; i++) {
                const p = particles[i];
                ctx.globalAlpha = Math.max(0, p.life * 0.8);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // === Drawing Functions ===
        function drawRect(obj) {
            ctx.fillStyle = obj.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = obj.color;
            ctx.fillRect(obj.x, obj.y, obj.width, obj.height);
            ctx.shadowBlur = 0;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 1;
            ctx.strokeRect(obj.x, obj.y, obj.width, obj.height);
        }

        function drawBall() {
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#fff';
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.size / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
            ctx.beginPath();
            ctx.arc(ball.x - ball.size * 0.2, ball.y - ball.size * 0.2, ball.size * 0.2, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawNet() {
            ctx.setLineDash([12, 12]);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();
            ctx.setLineDash([]);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, Math.min(40, canvas.height * 0.14), 0, Math.PI * 2);
            ctx.stroke();
        }

        function draw() {
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawNet();
            drawRect(player1);
            drawRect(player2);
            drawBall();
            drawParticles();
            ctx.globalAlpha = 1;
        }

        function syncPaddleGeometry() {
            const h = Math.max(44, Math.round(canvas.height * 0.2));
            player1.height = h;
            player2.height = h;
            player1.x = 15;
            player2.x = canvas.width - 15 - player2.width;
            player1.y = Math.max(0, Math.min(canvas.height - player1.height, player1.y));
            player2.y = Math.max(0, Math.min(canvas.height - player2.height, player2.y));
        }

        // === Game Logic ===
        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;

            // Serve deterministisch Richtung Punktverlierer oder alternierend, moderater Winkel (<= 35°)
            const direction = lastHitPlayer === 1 ? 1 : (lastHitPlayer === 2 ? -1 : serveDirection);
            serveDirection = -direction;
            const maxAngle = (35 * Math.PI) / 180;
            const angle = (Math.random() * 2 - 1) * maxAngle;
            const scaleSpeed = Math.max(4.5, Math.min(BASE_SPEED, canvas.width / 115));

            ball.speedX = direction * Math.cos(angle) * scaleSpeed;
            ball.speedY = Math.sin(angle) * scaleSpeed;
            lastHitPlayer = null;
        }

        function reflectY(y, minY, maxY) {
            const span = maxY - minY;
            if (span <= 0) return minY;
            let rel = (y - minY) % (2 * span);
            if (rel < 0) rel += 2 * span;
            return rel <= span ? minY + rel : maxY - (rel - span);
        }

        function updateBall() {
            const radius = ball.size / 2;
            ball.x += ball.speedX;
            ball.y += ball.speedY;

            // Maximale Geschwindigkeit begrenzen
            const currentSpeed = Math.hypot(ball.speedX, ball.speedY);
            if (currentSpeed > MAX_SPEED) {
                ball.speedX = (ball.speedX / currentSpeed) * MAX_SPEED;
                ball.speedY = (ball.speedY / currentSpeed) * MAX_SPEED;
            }

            // Wandkollision mit Ballradius (ball.size / 2)
            if (ball.y - radius <= 0) {
                ball.y = radius;
                ball.speedY = Math.abs(ball.speedY);
                playSound('hit');
                createParticles(ball.x, ball.y, '#fff', 8);
            } else if (ball.y + radius >= canvas.height) {
                ball.y = canvas.height - radius;
                ball.speedY = -Math.abs(ball.speedY);
                playSound('hit');
                createParticles(ball.x, ball.y, '#fff', 8);
            }

            const ballLeft = ball.x - radius;
            const ballRight = ball.x + radius;
            const ballTop = ball.y - radius;
            const ballBottom = ball.y + radius;

            // Spieler 1 Kollision (linkes Paddle) – energieerhaltender Abprallwinkel
            if (ball.speedX < 0 &&
                ballRight > player1.x && ballLeft < player1.x + player1.width &&
                ballTop < player1.y + player1.height && ballBottom > player1.y) {

                const hitPosition = Math.max(0, Math.min(1, (ball.y - player1.y) / player1.height));
                const angle = (hitPosition - 0.5) * (Math.PI * 0.45); // ca. -40.5° bis +40.5°
                const speed = Math.min(MAX_SPEED, Math.hypot(ball.speedX, ball.speedY) * 1.05);

                ball.speedX = Math.cos(angle) * speed;
                ball.speedY = Math.sin(angle) * speed;
                lastHitPlayer = 1;
                playSound('hit');
                createParticles(ball.x, ball.y, player1.color, 14);
                ball.x = player1.x + player1.width + radius + 1;
            }

            // Spieler 2 / CPU Kollision (rechtes Paddle) – energieerhaltender Abprallwinkel
            if (ball.speedX > 0 &&
                ballLeft < player2.x + player2.width && ballRight > player2.x &&
                ballTop < player2.y + player2.height && ballBottom > player2.y) {

                const hitPosition = Math.max(0, Math.min(1, (ball.y - player2.y) / player2.height));
                const angle = (hitPosition - 0.5) * (Math.PI * 0.45);
                const speed = Math.min(MAX_SPEED, Math.hypot(ball.speedX, ball.speedY) * 1.05);

                ball.speedX = -Math.cos(angle) * speed;
                ball.speedY = Math.sin(angle) * speed;
                lastHitPlayer = 2;
                playSound('hit');
                createParticles(ball.x, ball.y, player2.color, 14);
                ball.x = player2.x - radius - 1;
            }

            // Punktwertung
            if (ball.x + radius < 0) {
                player2Score++;
                aiScoreDisplay.textContent = player2Score;
                playSound('score');
                createParticles(canvas.width / 2, canvas.height / 2, player2.color, 26);

                if (player2Score >= WINNING_SCORE) {
                    endGame(2);
                    return;
                }
                lastHitPlayer = 2;
                resetBall();
            } else if (ball.x - radius > canvas.width) {
                player1Score++;
                playerScoreDisplay.textContent = player1Score;
                playSound('score');
                createParticles(canvas.width / 2, canvas.height / 2, player1.color, 26);

                if (player1Score >= WINNING_SCORE) {
                    endGame(1);
                    return;
                }
                lastHitPlayer = 1;
                resetBall();
            }
        }

        function movePlayer1() {
            // W/S (und im 1P-Modus auch Pfeiltasten) für flüssige Tastatursteuerung
            const direction = Number(keyboard.p1Down) - Number(keyboard.p1Up);
            if (direction) {
                player1.targetY = player1.y + player1.height / 2 + direction * 70;
            }
            const diff = player1.targetY - (player1.y + player1.height / 2);
            player1.y += diff * 0.14;
            if (player1.y < 0) player1.y = 0;
            if (player1.y + player1.height > canvas.height) player1.y = canvas.height - player1.height;
        }

        function movePlayer2() {
            if (gameMode === 'ai') {
                const center = player2.y + player2.height / 2;
                const radius = ball.size / 2;
                let target = canvas.height / 2;
                let responsiveness = 0.085;

                if (ball.speedX > 0.001) {
                    const distX = Math.max(0, (player2.x - radius) - ball.x);
                    const timeToReach = distX / ball.speedX;
                    const predictedRaw = ball.y + ball.speedY * timeToReach;
                    const predictedY = reflectY(predictedRaw, radius, canvas.height - radius);

                    if (difficulty === 'easy') {
                        target = ball.y + Math.sin(performance.now() * 0.004) * (player2.height * 0.65);
                        responsiveness = 0.05;
                    } else if (difficulty === 'medium') {
                        target = predictedY * 0.78 + ball.y * 0.22 + Math.sin(performance.now() * 0.005) * (player2.height * 0.25);
                        responsiveness = 0.085;
                    } else {
                        target = predictedY;
                        responsiveness = 0.14;
                    }
                } else {
                    // Ball fliegt weg -> sanft zur Mitte zurückkehren
                    responsiveness = difficulty === 'hard' ? 0.06 : 0.03;
                }

                target = Math.max(player2.height / 2, Math.min(canvas.height - player2.height / 2, target));
                const maxStep = difficulty === 'easy' ? 4.2 : (difficulty === 'medium' ? 6.5 : 10.5);
                const diff = target - center;
                player2.y += Math.max(-maxStep, Math.min(maxStep, diff * responsiveness));

                if (player2.y < 0) player2.y = 0;
                if (player2.y + player2.height > canvas.height) player2.y = canvas.height - player2.height;
            } else {
                const center = player2.y + player2.height / 2;
                const direction = Number(keyboard.p2Down) - Number(keyboard.p2Up);
                if (direction) player2.targetY = center + direction * 70;
                const diff = player2.targetY - center;
                player2.y += diff * 0.14;

                if (player2.y < 0) player2.y = 0;
                if (player2.y + player2.height > canvas.height) player2.y = canvas.height - player2.height;
            }
        }

        function gameLoop(timestamp) {
            if (!gameRunning) return;
            animationId = requestAnimationFrame(gameLoop);
            if (typeof timestamp !== 'number') timestamp = performance.now();

            const newWidth = canvas.offsetWidth;
            const newHeight = canvas.offsetHeight;
            if (newWidth > 0 && newHeight > 0 && (Math.abs(canvas.width - newWidth) > 1 || Math.abs(canvas.height - newHeight) > 1)) {
                canvas.width = newWidth;
                canvas.height = newHeight;
                syncPaddleGeometry();
            }

            if (lastFrameTime === 0) lastFrameTime = timestamp;
            let frameTime = timestamp - lastFrameTime;
            lastFrameTime = timestamp;
            if (frameTime > 250) frameTime = 250;

            if (!paused) {
                simAccumulator += frameTime;
                let steps = 0;
                while (simAccumulator >= FIXED_DT && steps < 5 && gameRunning) {
                    movePlayer1();
                    movePlayer2();
                    updateBall();
                    updateParticles();
                    simAccumulator -= FIXED_DT;
                    steps++;
                }
                if (simAccumulator > FIXED_DT * 5) simAccumulator = 0;
            }

            draw();
            if (paused) {
                ctx.save();
                ctx.fillStyle = 'rgba(0,0,0,0.58)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#0ff';
                ctx.font = `bold ${Math.max(24, Math.round(canvas.height * 0.11))}px "Courier New", monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('PAUSE', canvas.width / 2, canvas.height / 2);
                ctx.restore();
            }
        }

        // === Screen Management ===
        function showScreen(screenId) {
            const screens = overlay.querySelectorAll('.overlay-screen');
            screens.forEach(s => s.classList.remove('active'));
            const target = document.getElementById(screenId);
            target.classList.add('active');
            overlay.classList.remove('hidden');
            topActions.classList.add('hidden');
            renderStatsPills();
            const focusable = target.querySelector('button, [href], input, select, textarea');
            if (focusable) focusable.focus();
        }

        function returnToMenu() {
            gameRunning = false;
            paused = false;
            cancelAnimationFrame(animationId);
            btnPause.textContent = '⏸ Pause';
            showMainMenuScreen();
        }

        // === Game Flow ===
        function startGame() {
            if (gameRunning) return;

            ensureAudio();

            const p1Input = document.getElementById('player1-name');
            const p2Input = document.getElementById('player2-name');
            const player1Input = p1Input ? p1Input.value.trim() : '';
            const player2Input = p2Input ? p2Input.value.trim() : '';

            if (player1Input) player1Name = player1Input;
            if (player2Input) player2Name = player2Input;

            player1NameDisplay.textContent = player1Name;
            aiScoreLabel.textContent = gameMode === '2p' ? player2Name : 'CPU';

            player1Score = 0;
            player2Score = 0;
            playerScoreDisplay.textContent = '0';
            aiScoreDisplay.textContent = '0';
            gameWon = false;
            paused = false;
            btnPause.textContent = '⏸ Pause';
            ball.speedMultiplier = 1;

            overlay.classList.add('hidden');
            topActions.classList.remove('hidden');

            if (canvas.offsetWidth > 0 && canvas.offsetHeight > 0) {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
            }
            syncPaddleGeometry();
            player1.y = canvas.height / 2 - player1.height / 2;
            player2.y = canvas.height / 2 - player2.height / 2;
            player1.targetY = player1.y + player1.height / 2;
            player2.targetY = player2.y + player2.height / 2;
            clearKeyboardInput();

            lastHitPlayer = null;
            resetBall();
            lastFrameTime = 0;
            simAccumulator = 0;

            gameRunning = true;
            gameLoop();
        }

        function endGame(winner) {
            gameRunning = false;
            paused = false;
            btnPause.textContent = '⏸ Pause';
            cancelAnimationFrame(animationId);

            const winnerName = winner === 1 ? player1Name : (gameMode === 'ai' ? 'CPU' : player2Name);
            const loserName = winner === 1 ? (gameMode === 'ai' ? 'CPU' : player2Name) : player1Name;

            const winnerScore = winner === 1 ? player1Score : player2Score;
            const loserScore = winner === 1 ? player2Score : player1Score;
            addToScoreboard(winnerName, loserName, winnerScore, loserScore);

            // Lokale Statistiken & GameScores aktualisieren
            pongStats.gamesPlayed++;
            const p1Won = winner === 1;
            if (p1Won) {
                pongStats.wins++;
                pongStats.winStreak++;
                pongStats.bestStreak = Math.max(pongStats.bestStreak, pongStats.winStreak);
            } else {
                pongStats.losses++;
                pongStats.winStreak = 0;
            }
            savePongStats();
            if (window.GameScores && typeof window.GameScores.record === 'function') {
                window.GameScores.record('pong', {
                    score: player1Score,
                    won: p1Won,
                    meta: { mode: gameMode, difficulty },
                    label: `${pongStats.wins} Siege · Serie ${pongStats.bestStreak}`
                });
            }

            const secondName = gameMode === 'ai' ? 'CPU' : player2Name;
            winnerText.textContent = `${winnerName} hat gewonnen!`;
            scoreResult.textContent = `${player1Name}: ${player1Score} - ${secondName}: ${player2Score}`;

            showScreen('screen-game-over');
            playSound('win');
        }

        function restartGame() {
            const p1Input = document.getElementById('player1-name');
            const p2Input = document.getElementById('player2-name');
            if (p1Input) player1Name = p1Input.value.trim() || player1Name;
            if (p2Input && gameMode === '2p') player2Name = p2Input.value.trim() || player2Name;
            player1NameDisplay.textContent = player1Name;
            aiScoreLabel.textContent = gameMode === '2p' ? player2Name : 'CPU';
            startGame();
        }

        function showMainMenuScreen() {
            showScreen('screen-main-menu');
        }

        function selectMode(mode) {
            gameMode = mode;
            const btnAi = document.getElementById('btn-ai');
            const btn2p = document.getElementById('btn-2p');
            if (btnAi) btnAi.classList.toggle('active', mode === 'ai');
            if (btn2p) btn2p.classList.toggle('active', mode === '2p');
            if (difficultySelect) difficultySelect.classList.toggle('hidden-group', mode === '2p');

            aiScoreLabel.textContent = mode === 'ai' ? 'CPU' : player2Name;
        }

        function setDifficulty(level) {
            difficulty = level;
            const buttons = difficultySelect.querySelectorAll('button');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (level === 'easy') buttons[0].classList.add('active');
            else if (level === 'medium') buttons[1].classList.add('active');
            else if (level === 'hard') buttons[2].classList.add('active');
        }

        // === Scoreboard ===
        function addToScoreboard(winner, loser, winnerScore, loserScore) {
            const now = Date.now();
            const entry = {
                timestamp: now,
                date: new Date(now).toLocaleString('de-DE'),
                winner,
                loser,
                score: `${winnerScore}-${loserScore}`
            };

            scoreboardData.push(entry);
            if (scoreboardData.length > 20) scoreboardData.shift();

            try {
                localStorage.setItem('pongScoreboard', JSON.stringify(scoreboardData));
            } catch (e) {}
        }

        function showScoreboardScreen() {
            overlayScoreboard.innerHTML = '';

            if (scoreboardData.length === 0) {
                scoreboardEmpty.style.display = 'block';
                overlayScoreboard.appendChild(scoreboardEmpty);
            } else {
                scoreboardEmpty.style.display = 'none';
                const sortedScores = [...scoreboardData].sort((a, b) => {
                    const ta = typeof a.timestamp === 'number' ? a.timestamp : (Date.parse(a.date) || 0);
                    const tb = typeof b.timestamp === 'number' ? b.timestamp : (Date.parse(b.date) || 0);
                    return tb - ta;
                });
                sortedScores.forEach(entry => {
                    const div = document.createElement('div');
                    div.className = 'score-entry';
                    const date = document.createElement('span');
                    date.textContent = String(entry.date || '');
                    const result = document.createElement('span');
                    result.textContent = `${String(entry.winner || '')} besiegte ${String(entry.loser || '')} ${String(entry.score || '')}`;
                    div.append(date, result);
                    overlayScoreboard.appendChild(div);
                });
            }

            showScreen('screen-scoreboard');
        }

        function togglePause() {
            if (!gameRunning) return;
            paused = !paused;
            btnPause.textContent = paused ? '▶ Weiter' : '⏸ Pause';
            if (paused) {
                lastFrameTime = 0;
                simAccumulator = 0;
            }
        }

        // === Input Handling (mit exakter Y-Skalierung) ===
        function clientYToCanvasY(clientY, rect) {
            const scaleY = rect.height > 0 ? canvas.height / rect.height : 1;
            return (clientY - rect.top) * scaleY;
        }

        function handleMouseMove(e) {
            if (!gameRunning || paused) return;
            const rect = canvas.getBoundingClientRect();
            const y = clientYToCanvasY(e.clientY, rect);
            if (!player1.isTouching) {
                player1.targetY = y;
            }
        }

        function handleKeyDown(e) {
            const ae = document.activeElement;
            if (ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;

            if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
                if (gameRunning) {
                    e.preventDefault();
                    togglePause();
                }
                return;
            }
            if (!gameRunning) return;

            if (gameMode === 'ai') {
                if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') {
                    if (e.key === 'ArrowUp') e.preventDefault();
                    keyboard.p1Up = true;
                } else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') {
                    if (e.key === 'ArrowDown') e.preventDefault();
                    keyboard.p1Down = true;
                }
            } else {
                if (e.key === 'w' || e.key === 'W') keyboard.p1Up = true;
                else if (e.key === 's' || e.key === 'S') keyboard.p1Down = true;
                else if (e.key === 'ArrowUp') { e.preventDefault(); keyboard.p2Up = true; }
                else if (e.key === 'ArrowDown') { e.preventDefault(); keyboard.p2Down = true; }
            }
        }

        function handleKeyUp(e) {
            if (gameMode === 'ai') {
                if (e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keyboard.p1Up = false;
                else if (e.key === 's' || e.key === 'S' || e.key === 'ArrowDown') keyboard.p1Down = false;
            } else {
                if (e.key === 'w' || e.key === 'W') keyboard.p1Up = false;
                else if (e.key === 's' || e.key === 'S') keyboard.p1Down = false;
                else if (e.key === 'ArrowUp') keyboard.p2Up = false;
                else if (e.key === 'ArrowDown') keyboard.p2Down = false;
            }

            if (!keyboard.p1Up && !keyboard.p1Down) player1.targetY = player1.y + player1.height / 2;
            if (!keyboard.p2Up && !keyboard.p2Down) player2.targetY = player2.y + player2.height / 2;
        }

        function clearKeyboardInput() {
            keyboard.p1Up = keyboard.p1Down = keyboard.p2Up = keyboard.p2Down = false;
            player1.targetY = player1.y + player1.height / 2;
            player2.targetY = player2.y + player2.height / 2;
        }

        function handleTouchStart(e) {
            if (!gameRunning || paused) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const midX = rect.left + rect.width / 2;
            for (const touch of e.changedTouches) {
                const y = clientYToCanvasY(touch.clientY, rect);
                if (gameMode === 'ai' || touch.clientX < midX) {
                    player1.isTouching = true;
                    player1.targetY = y;
                } else {
                    player2.isTouching = true;
                    player2.targetY = y;
                }
            }
        }

        function handleTouchMove(e) {
            if (!gameRunning || paused || e.touches.length === 0) return;
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const midX = rect.left + rect.width / 2;
            for (const touch of e.touches) {
                const y = clientYToCanvasY(touch.clientY, rect);
                if (gameMode === 'ai' || touch.clientX < midX) player1.targetY = y;
                else player2.targetY = y;
            }
        }

        function handleTouchEnd(e) {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const midX = rect.left + rect.width / 2;
            let leftActive = false, rightActive = false;
            for (const touch of e.touches) {
                if (gameMode === 'ai' || touch.clientX < midX) leftActive = true;
                else rightActive = true;
            }
            if (!leftActive) player1.isTouching = false;
            if (!rightActive) player2.isTouching = false;
        }

        // === Initialization ===
        function init() {
            initSounds();
            if (canvas.offsetWidth > 0 && canvas.offsetHeight > 0) {
                canvas.width = canvas.offsetWidth;
                canvas.height = canvas.offsetHeight;
            } else {
                canvas.width = 640;
                canvas.height = 400;
            }

            syncPaddleGeometry();
            player1.y = canvas.height / 2 - player1.height / 2;
            player2.y = canvas.height / 2 - player2.height / 2;
            player1.targetY = player1.y + player1.height / 2;
            player2.targetY = player2.y + player2.height / 2;
            paused = false;
            lastFrameTime = 0;
            simAccumulator = 0;

            resetBall();
            renderStatsPills();
            draw();
        }

        function handleResize() {
            const newWidth = canvas.offsetWidth;
            const newHeight = canvas.offsetHeight;
            if (newWidth > 0 && newHeight > 0 && (Math.abs(canvas.width - newWidth) > 1 || Math.abs(canvas.height - newHeight) > 1)) {
                canvas.width = newWidth;
                canvas.height = newHeight;
            }
            syncPaddleGeometry();
            ball.x = Math.max(ball.size / 2, Math.min(canvas.width - ball.size / 2, ball.x));
            ball.y = Math.max(ball.size / 2, Math.min(canvas.height - ball.size / 2, ball.y));
            if (!gameRunning) draw();
        }
        let resizeTimer = null;
        function debouncedResize() {
            if (resizeTimer) clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => { resizeTimer = null; handleResize(); }, 150);
        }

        // === Event Listeners ===
        canvas.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('keydown', handleKeyDown);
        document.addEventListener('keyup', handleKeyUp);
        window.addEventListener('blur', clearKeyboardInput);
        canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
        canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
        canvas.addEventListener('touchend', handleTouchEnd);

        window.addEventListener('resize', debouncedResize);
        window.addEventListener('orientationchange', debouncedResize);
        init();
    </script>
</body>
</html>
