name: Tetris - Build & Deploy

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  GAME_VERSION: '1.0'

jobs:
  lint:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '24'

      - name: Run smoke test
        run: node smoke-test.cjs

      - name: Run HTMLHint
        run: npx --yes htmlhint@1.9.2 index.html tetris.html

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Create build artifact
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: ${{ env.GAME_VERSION }}
        run: |
          set -eu
          mkdir -p build
          cp index.html tetris.html tetris-logic.js build/
          {
            printf 'Build completed at %s\n' "$(date -u)"
            printf 'Commit: %s\n' "$COMMIT_SHA"
            printf 'Branch: %s\n' "$REF_NAME"
            printf 'Version: %s\n' "$VERSION"
          } > build/BUILD_INFO.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tetris
          path: build/
          retention-days: 30
          if-no-files-found: error

  release:
    name: Auto Release
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tetris
          path: release-artifacts/

      - name: Create release archive
        env:
          RELEASE_TAG: v${{ env.GAME_VERSION }}.${{ github.run_number }}
        run: |
          set -eu
          archive_name="tetris-${RELEASE_TAG//[^A-Za-z0-9._-]/_}.zip"
          cd release-artifacts
          zip -r "../$archive_name" .
          printf 'ARCHIVE=%s\n' "../$archive_name" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ env.GAME_VERSION }}.${{ github.run_number }}
        run: |
          set -eu
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists – skipping."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            "$ARCHIVE" \
            --repo "${{ github.repository }}" \
            --target "${{ github.event.repository.default_branch }}" \
            --title "Tetris $RELEASE_TAG" \
            --generate-notes \
            --latest

  pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tetris
          path: site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
