name: CI - Tetris HTML

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - "tetris.html"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - "tetris.html"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate-html:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tetris.html exists
        run: test -f tetris.html

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install HTMLHint
        run: npm install --no-save htmlhint

      - name: Validate HTML
        run: npx htmlhint tetris.html