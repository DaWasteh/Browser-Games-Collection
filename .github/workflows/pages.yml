name: Deploy to GitHub Pages

# Spielt das Spiel bei jedem Push auf den Default-Branch automatisch aus.
# Einmalig aktivieren: Settings → Pages → Source: GitHub Actions

on:
  push:
    branches: [master, main]
  workflow_dispatch: # manueller Trigger über den Actions-Tab

permissions:
  contents: read
  pages: write        # darf Pages-Artifact veröffentlichen
  id-token: write     # OIDC für den Pages-Deploy

# Verhindert parallele Deploys – nur der neueste Push gewinnt
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage für Pages
        run: |
          mkdir -p _site
          # index.html als Einstieg, damit die Root-URL direkt das Spiel lädt
          cp panda_lemmings.html _site/index.html

      - name: Pages-Artifact hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
